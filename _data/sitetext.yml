# MELD4AMR public-facing website content.
# Locale used in _config.yml: en-US

en: &DEFAULT_EN
  header:
    title: "MELD4AMR"
    text: "Molecular Embeddings via Low-Distortions Framework for Antimicrobial Resistance"


  about:
    title: "Our Mission"
    text: "Efficient molecular representations. Interpretable insights. Responsible collaboration."
    body: >-
      MELD4AMR is a German–Serbian research project developing compact,
      interpretable, and privacy-aware molecular representations for
      antimicrobial resistance (AMR) research. We aim to make complex
      molecular data easier to analyse while retaining information relevant
      to biological activity. By bringing together expertise in artificial
      intelligence, mathematics, and computational biology, we seek to support
      antimicrobial discovery and public health research.
    section: about

  services:
    title: "Research Focus"
    text: "Three complementary directions for molecular AI."
    section: services
    list:
      - title: "Efficient Molecular Embeddings"
        desc: >-
          Developing compact molecular representations that aim to preserve
          meaningful relationships while reducing the computational demands
          of large-scale analysis.
        icon: "fas fa-project-diagram"

      - title: "Interpretability & Explainability"
        desc: >-
          Investigating how molecular representations can retain biologically
          relevant information and provide insights that researchers can
          understand and evaluate.
        icon: "fas fa-search"

      - title: "Privacy-Aware Collaboration"
        desc: >-
          Exploring privacy-preserving methods for molecular data analysis to
          support responsible research and collaboration across institutions
          and national borders.
        icon: "fas fa-shield-alt"

  portfolio:
    title: "Publications"
    text: "Explore the key publications of the MELD4AMR project."
    section: portfolio
    closebutton: "Close"

  timeline:
    title: "Timeline"
    text: "Explore the key milestones of the MELD4AMR project, from its initial research foundations and conception to its implementation and ongoing scientific collaboration."
    section: timeline
    start_align: "left"
    events:
      - title: "First Foundational Publication"
        year: "January 2023"
        desc: >-
          **Hattab, G.**, **Anžel, A.**, Spänig, S., Neumann, N., & Heider, D. (01 2023). *A parametric approach for molecular encodings using multilevel atomic neighborhoods applied to peptide classification*. NAR Genomics and Bioinformatics, 5(1). [https://doi.org/10.1093/nargab/lqac103](https://doi.org/10.1093/nargab/lqac103){:target='_blank'}
        icon: "fas fa-file-alt"
        align: "left"
      - title: "Second Foundational Publication"
        year: "May 2024"
        desc: >-
          Weckbecker, M., **Anžel, A.**, Yang, Z., & **Hattab, G.** (2024). *Interpretable Molecular Encodings and Representations for Machine Learning Tasks*. Computational and Structural Biotechnology Journal, 23, 2326–2336. [https://doi.org/10.1016/j.csbj.2024.05.035](https://doi.org/10.1016/j.csbj.2024.05.035){:target='_blank'}
        icon: "fas fa-file-alt"
        align: "right"
      - title: "Project Conception and Collaboration"
        year: "April 2025"
        desc: >-
          Dr. Aleksandar Anžel and PD Dr. Georges Hattab initiated the project concept, establishing the foundation for a collaborative research effort. They brought together Nevena Ćirić, Prof. Dr. Jovana Kovačević, and Dr. Nevena Veljković to contribute their complementary expertise and strengthen the scientific collaboration.
        icon: "fas fa-edit"
        align: "left"
      - title: "Project Repository and Website"
        year: "October 2026"
        desc: >-
          The official MELD4AMR GitHub repository and project website were established to provide a central platform for sharing project information, research outputs, software, documentation, and related resources. The website serves as the public home for the project, while the repository supports transparent and collaborative development.
          Visit the [GitHub repository](https://github.com/MELD4AMR) and the [project website](https://meld4amr.github.io/).
        icon: "fas fa-book-open"
        align: "right"
      - title: "Official Project Start"
        year: "November 2026"
        desc: >-
          MELD4AMR brings together researchers from Germany and Serbia to develop efficient, interpretable, and privacy-aware molecular representations for antimicrobial resistance research. The project builds on established research in molecular encoding and machine learning to advance methods that support reliable, transparent, and collaborative scientific discovery.
        icon: "fas fa-flag"
        align: "left"
      - title: "Ongoing Research and Implementation"
        year: ""
        desc: >-
          The team is actively implementing the project objectives, translating the research concept into practical methods and tools. Through coordinated efforts across the participating institutions, the researchers are progressively developing and evaluating approaches to molecular representation that address the challenges of antimicrobial resistance research.
        icon: "fas fa-cogs"
        align: "right"

      # Add publications only after they have been published.
