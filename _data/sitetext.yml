      #     [AUTHORS]. [JOURNAL OR CONFERENCE].
      #     [One short sentence describing the contribution.]
      #     [Read the publication](https://doi.org/REPLACE-WITH-DOI)
      #   icon: "fas fa-file-alt"

    end: "More<br>to Come"

