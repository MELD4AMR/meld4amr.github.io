en: &DEFAULT_EN
  header:
    title: "MELD4AMR"
    text: "Molecular AI for Antimicrobial Resistance Research"
    button: "Discover Our Mission"
    buttonlink: "#about"

  about:
    title: "Our Mission"
    text: "Efficient molecular representations. Interpretable insights. Responsible collaboration."
    body: >-
      MELD4AMR is a German–Serbian research project developing
      compact, interpretable, and privacy-aware molecular representations
      for antimicrobial resistance (AMR) research.
      We aim to make complex molecular data easier to analyse while
      retaining information relevant to biological activity.
      By bringing together expertise in artificial intelligence,
      mathematics, and computational biology, we seek to support
      antimicrobial discovery and public health research.
    section: about

  services:
    title: "Research Focus"
    text: "Three complementary directions for molecular AI."
    section: services
    list:
      - title: "Efficient Molecular Embeddings"
        desc: >-
          Developing compact molecular representations that aim to
          preserve meaningful relationships while reducing the
          computational demands of large-scale analysis.
        icon: "fas fa-project-diagram"

      - title: "Interpretability & Explainability"
        desc: >-
          Investigating how molecular representations can retain
          biologically relevant information and provide insights
          that researchers can understand and evaluate.
        icon: "fas fa-search"

      - title: "Privacy-Aware Collaboration"
        desc: >-
          Exploring privacy-preserving methods for molecular data
          analysis to support responsible research and collaboration
          across institutions and national borders.
        icon: "fas fa-shield-alt"

  timeline:
    title: "Timeline & Publications"
    text: "Follow the project from its beginning to its published research."
    section: timeline
    start_align: "left"
    events:
      - title: "Project Start"
        year: "[CONFIRM START MONTH AND YEAR]"
        desc: >-
          MELD4AMR brings together German and Serbian researchers
          to advance efficient, interpretable, and privacy-aware
          molecular representations for antimicrobial resistance research.
        icon: "fas fa-flag"

      # Add project publications here after they are published.
      # The proposal's bibliography contains prior and related work,
      # not publications produced by MELD4AMR.
      #
